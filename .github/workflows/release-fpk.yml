name: Build & Release fnOS FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'FPK package version (leave empty to use packaging/fpk/VERSION)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-fpk:
    name: Build Multi-Arch Image & fnOS .fpk Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and image metadata
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
          else
            RAW_VER="$(head -n 1 packaging/fpk/VERSION | tr -d '[:space:]')"
          fi
          VER="${RAW_VER#v}"
          IMAGE_REPO="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "repo_url=https://github.com/${GITHUB_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export amd64 offline Docker archive from Buildx cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/trim-music-hub-amd64.tar
          cache-from: type=gha

      - name: Export arm64 offline Docker archive from Buildx cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/trim-music-hub-arm64.tar
          cache-from: type=gha

      - name: Package fnOS .fpk variants (offline amd64, offline arm64, online, source)
        run: |
          VER="${{ steps.meta.outputs.version }}"
          IMG="${{ steps.meta.outputs.image_repo }}:${VER}"
          OWNER="${{ github.repository_owner }}"
          URL="${{ steps.meta.outputs.repo_url }}"

          ./packaging/fpk/build.sh \
            --mode bundle \
            --arch amd64 \
            --version "${VER}" \
            --image "${IMG}" \
            --image-tar /tmp/trim-music-hub-amd64.tar \
            --maintainer "${OWNER}" \
            --maintainer-url "${URL}"

          ./packaging/fpk/build.sh \
            --mode bundle \
            --arch arm64 \
            --version "${VER}" \
            --image "${IMG}" \
            --image-tar /tmp/trim-music-hub-arm64.tar \
            --maintainer "${OWNER}" \
            --maintainer-url "${URL}"

          ./packaging/fpk/build.sh \
            --mode online \
            --version "${VER}" \
            --image "${IMG}" \
            --maintainer "${OWNER}" \
            --maintainer-url "${URL}"

          ./packaging/fpk/build.sh \
            --mode source \
            --version "${VER}" \
            --maintainer "${OWNER}" \
            --maintainer-url "${URL}"

          ls -lh dist/

      - name: Upload .fpk workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trim-music-hub-${{ steps.meta.outputs.version }}-fpk
          path: |
            dist/*.fpk
            dist/*.fpk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.fpk
            dist/*.fpk.sha256
